[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucits-etf-issuer-holdings"
version = "0.1.0"
description = "Full holdings of a UCITS ETF by ISIN, read from the issuer's own published files and normalised to one JSON shape."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dylan Merigaud" }]
keywords = ["etf", "ucits", "holdings", "isin", "look-through", "ishares", "vanguard", "xtrackers", "amundi", "spdr", "invesco"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/DylanMerigaud/ucits-etf-issuer-holdings"
Repository = "https://github.com/DylanMerigaud/ucits-etf-issuer-holdings"
Issues = "https://github.com/DylanMerigaud/ucits-etf-issuer-holdings/issues"

[project.scripts]
ucits-holdings = "ucits_etf_holdings.cli:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4", "mypy>=1.10", "ruff>=0.5", "httpx[socks]>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/ucits_etf_holdings"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "schema", "docs", "LICENSE", "README.md", "pyproject.toml", "ruff.toml"]

[tool.mypy]
files = ["src"]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: contract tests that call the real issuer sites (UCITS_HOLDINGS_LIVE=1)"]
