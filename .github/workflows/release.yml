name: release

# Publishes both packages when a version tag is pushed. No registry token is stored:
# PyPI and npm trust this workflow through OIDC (trusted publishing).
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: the tag must match the packaged version
        run: |
          packaged=$(uv run --no-project python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$packaged"
      - run: uv sync --all-groups
      - run: uv run pytest
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: pypi
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: the tag must match the packaged version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run build
      - run: npm test
      # trusted publishing through OIDC needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
